name: Pruebas end-to-end

# Reutilizable: lo llaman ci.yml (pull requests) y deploy.yml (antes de desplegar).
# Un navegador de verdad (Playwright) usa la app: pedido desde el movil, camarero y cocina.
# Arranca la API (jar con H2 y datos de demo) y ng serve; ver playwright.config.ts.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Compilar la API (jar)
        working-directory: backend
        run: bash ./mvnw -B -q package -DskipTests
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      # Si algo falla: informe con capturas, video del paso y traza (se abre con npx playwright show-trace)
      - name: Informe si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
