name: Pruebas end-to-end

# Reutilizable: lo llaman ci.yml (pull requests) y deploy.yml (antes de desplegar).
# Un navegador de verdad (Playwright) usa la app: pedido desde el movil, camarero y cocina.
# Contra PanGestion montada como en produccion (scripts/e2e-produccion.sh): la imagen Docker de la API con
# PostgreSQL y Caddy (el mismo docker-compose.yml y Caddyfile de la VM) y el build de produccion del frontend
# servido como GitHub Pages, por HTTPS. Cada comprobacion sale en el resumen de la ejecucion.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    name: End-to-end (Playwright, como en producción)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_TARGET: produccion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Montar PanGestion como en producción (Docker Compose, PostgreSQL, Caddy y build de producción)
        run: bash scripts/e2e-produccion.sh
      - run: npx playwright install --with-deps chromium
      - name: Pruebas (el bot usa la app)
        run: npx playwright test
      # Todas las consultas del panel (GET, con sus filtros) contra PostgreSQL: la misma comprobacion que se
      # hace despues de desplegar contra produccion (scripts/comprobar-api.mjs)
      - name: Consultas de la API (solo lectura)
        if: always()
        env:
          API_URL: https://localhost
          CHECK_EMAIL: admin2@admin.es
          CHECK_PASSWORD: admin1234
          CHECK_TITLE: Consultas de la API antes de desplegar (PostgreSQL, datos de demo)
          CHECK_LOGIN_ATTEMPTS: "10"
          # Certificado propio de Caddy para localhost (solo en esta prueba)
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
        run: node scripts/comprobar-api.mjs
      - name: Logs de la API si algo falla
        if: failure()
        run: |
          docker compose -p pangestion-e2e -f backend/deploy/docker-compose.yml -f backend/deploy/e2e/docker-compose.e2e.yml \
            --env-file backend/deploy/e2e/.env logs --tail 200 api caddy
      # Si algo falla: informe con capturas y traza (se abre con npx playwright show-trace)
      - name: Informe si algo falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
      - name: Parar el entorno
        if: always()
        run: bash scripts/e2e-produccion.sh down || true
