name: Frontend en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Compilar Angular
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # El sitio se sirve en https://<usuario>.github.io/<repositorio>/
      - run: npx ng build --base-href "/${{ github.event.repository.name }}/"
      # Pages no conoce las rutas de Angular: 404.html = index.html para que /PanGestion/pedidos funcione al recargar
      - run: cp dist/gestion-pedidos/browser/index.html dist/gestion-pedidos/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/gestion-pedidos/browser

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
