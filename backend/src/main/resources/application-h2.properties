# Base de datos H2 en fichero (./data/pangestion) para desarrollo
spring.datasource.url=jdbc:h2:file:./data/pangestion;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Consola web: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Solo para desarrollo local con H2: si no hay JWT_SECRET se usa esta clave de pruebas
app.jwt.secret=${JWT_SECRET:clave-de-desarrollo-local-no-usar-en-produccion}
