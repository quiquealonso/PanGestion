spring.application.name=pangestion-api
server.port=8080

# Perfil por defecto: H2 (no requiere instalar nada). Para PostgreSQL: --spring.profiles.active=postgres
spring.profiles.default=h2

# JPA / Hibernate: las entidades de com.pangestion.model generan las tablas
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# Carga en bloque las colecciones perezosas (evita el problema N+1 en listados)
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# JSON estricto (S5): un campo que no existe en el DTO (una errata, o "id"/"total" que solo pone el servidor)
# se rechaza con 400 en lugar de ignorarse en silencio
spring.jackson.deserialization.fail-on-unknown-properties=true

# JWT: el secreto se lee de la variable JWT_SECRET (minimo 32 caracteres). Nunca escribirlo aqui.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=480

# Cifrado AES-256-GCM de datos personales (telefono y CIF de clientes, direccion de entrega).
# Variable ENCRYPTION_KEY: 32 bytes en Base64 (openssl rand -base64 32). Si se pierde, esos datos no se pueden leer.
app.encryption.key=${ENCRYPTION_KEY}

# Limite de intentos (login y pedidos publicos), ver RateLimiter
app.rate-limit.enabled=true

# Detras de Caddy: la IP real del cliente y el https llegan en X-Forwarded-For / X-Forwarded-Proto
server.forward-headers-strategy=native

# Origen permitido para el frontend Angular
app.cors.allowed-origins=http://localhost:4200

# Cargar datos de ejemplo si la base de datos esta vacia
app.seed-data=${SEED_DATA:true}

# Imagenes subidas (productos). Carpeta local; no se sube a Git.
app.uploads.dir=${UPLOADS_DIR:./uploads}
app.uploads.max-bytes=2097152
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
