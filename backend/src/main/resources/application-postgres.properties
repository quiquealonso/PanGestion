# PostgreSQL (base de datos objetivo del proyecto)
# Las credenciales NO se escriben aqui: se leen de variables de entorno o del fichero backend/.env
# (copia .env.example a .env y rellenalo; .env esta en .gitignore).
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pangestion}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Hibernate crea/actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update

# Sin usuarios de prueba salvo que se pida expresamente (SEED_DATA=true)
app.seed-data=${SEED_DATA:false}
