# Perfil de tests (@ActiveProfiles("test")): base de datos en memoria, sin datos de ejemplo
spring.datasource.url=jdbc:h2:mem:pangestion-api-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Clave solo para los tests (HS256 necesita 32 caracteres o mas)
app.jwt.secret=clave-solo-para-tests-de-pangestion-32-caracteres
app.encryption.key=AaJV6AcpJbXwAoNGvs7T36m1PUGITozVQ5It8nlw5zg=

# Sin limite de intentos: los tests hacen muchos logins seguidos (RateLimiterTest lo prueba aparte)
app.rate-limit.enabled=false

# Cada test crea sus propios datos
app.seed-data=false

# Las imagenes de los tests van a target/, nunca a la carpeta real
app.uploads.dir=target/test-uploads
