<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <!-- Solo en produccion (GitHub Pages no permite cabeceras): scripts solo propios; la API es el unico servidor externo.
         Los estilos inline los necesita Angular (estilos de componentes). Si cambia la URL de la API, cambiarla aqui tambien. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://34-175-204-112.sslip.io; connect-src 'self' https://34-175-204-112.sslip.io; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>PanGestión</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="PanGestión: pedidos, obrador, sala, cocina y reparto de tu panadería o bar. Haz tu pedido online o entra en la gestión de tu negocio." />
    <meta name="theme-color" content="#09111f" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- App instalable (PWA). pwa-init.js cambia manifiesto, icono y titulo en la web de pedidos (/pedido) -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PanGestión" />
    <!-- Scripts en fichero (no inline) para que la CSP de produccion no tenga que permitir scripts inline -->
    <script src="pwa-init.js"></script>
    <script src="theme-init.js"></script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>PanGestión necesita JavaScript.</noscript>
  </body>
</html>
